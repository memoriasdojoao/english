<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laisla's English Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#26384d;--mut:#5d7389;--p:#a9d6f5;--p2:#e6f3fd;--pd:#2f7fb8;--ok:#3f9f74;--bad:#d4556f;--line:#d9eaf7;--sbg:#e0f0fc;--nvh:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1724;--card:#142030;--ink:#e8f1fa;--mut:#93a9c0;--p:#4f86b3;--p2:#1c3149;--pd:#9fd0f4;--line:#233a53;--sbg:#112030;--nvh:#1c3149}}
:root[data-theme="dark"]{--bg:#0e1724;--card:#142030;--ink:#e8f1fa;--mut:#93a9c0;--p:#4f86b3;--p2:#1c3149;--pd:#9fd0f4;--line:#233a53;--sbg:#112030;--nvh:#1c3149}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;display:flex;background:var(--bg);color:var(--ink);font:16px/1.75 Nunito,system-ui,sans-serif;transition:background .3s,color .3s}
h1,h2,h3,.br{font-family:Fraunces,Georgia,serif;line-height:1.25;margin:0 0 12px}
h1{font-size:32px;font-weight:800}h2{font-size:23px;margin-top:28px}h3{font-size:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.inp:focus-visible{outline:3px solid var(--pd);outline-offset:2px}
#sb{width:280px;flex:none;position:sticky;top:0;align-self:flex-start;height:100dvh;overflow:auto;background:var(--sbg);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:2px}
.br{font-size:19px;font-weight:800;color:var(--pd)}.bw{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:18px}.bw .br{color:#2f7fb8;margin:0}.lg{width:58px;height:58px;border-radius:50%;flex:none;background:#fff;object-fit:cover}
.nv{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;font-size:15px;line-height:1.4}
.nv:hover{background:var(--nvh)}.nv.on{background:var(--nvh);color:var(--pd);font-weight:800;box-shadow:inset 3px 0 var(--pd)}
.nv small{display:block;color:var(--mut);font-weight:400}
.st{margin-top:auto;background:var(--nvh);padding:12px;border:1px solid var(--line);border-radius:12px;font-size:14px}
#ct{flex:1;min-width:0}#top{display:none}
main{max-width:800px;margin:auto;padding:40px 28px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.card.res{background:var(--p2)}.card p{margin:0 0 10px}
.btn{background:var(--pd);color:var(--bg);border:0;border-radius:10px;padding:11px 22px;font-weight:800}
.btn.g{background:var(--p2);color:var(--ink);border:1px solid var(--line);padding:8px 16px}
.bar{height:10px;background:var(--p2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--pd));transition:width .6s}
.mut{color:var(--mut);font-size:15px}.hd{display:flex;justify-content:space-between}
.row{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:8px 0;transition:border-color .2s}
.row:hover{border-color:var(--pd)}
.say{cursor:pointer;border-bottom:2px dotted var(--pd);font-weight:600}
.n{margin-top:14px;padding:12px 16px;border-left:4px solid var(--pd);background:var(--p2);border-radius:0 10px 10px 0;font-size:15px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 16px;border:2px solid var(--line);background:var(--card);border-radius:10px;transition:.2s}
.opt:hover{border-color:var(--p)}.opt.sel{border-color:var(--pd);background:var(--p2)}
.opt.ok,.inp.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.no,.inp.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.inp{display:block;width:100%;padding:11px 14px;margin:8px 0;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.why{margin-top:10px;padding:12px 16px;border-radius:10px;background:var(--p2);font-size:15px}
.fc{display:grid;place-items:center;width:100%;min-height:150px;padding:16px;text-align:center;font:800 28px Fraunces,Georgia,serif;border:2px dashed var(--p);border-radius:14px;background:var(--p2);margin-bottom:12px}
@media(max-width:820px){#sb{position:fixed;left:0;top:0;z-index:9;transform:translateX(-100%);transition:transform .25s;width:min(300px,86%);padding-top:calc(24px + env(safe-area-inset-top,0px))}#sb.o{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
#top{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}main{padding:24px 16px 60px}h1{font-size:26px}}
@media print{#sb,#top,.btn{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<aside id="sb"><div class="bw"><img class="lg" alt="Laisla"><div class="br">Laisla's English Journey</div></div><nav id="nav"></nav><div class="st" id="st"></div></aside>
<div id="ct"><div id="top"><button class="btn g" data-a="menu">Menu</button><img class="lg" alt="" style="width:36px;height:36px"><b class="br" style="margin:0;font-size:16px">Laisla's English Journey</b></div><main id="app"></main></div>
<script>
const MSG="Bem-vinda ao seu curso. Estude no seu ritmo: cada lição explica o porquê das regras, os exercícios corrigem na hora e cada módulo termina com uma prova. Os erros voltam na revisão espaçada para fixar o conteúdo.";
const WPP=""; // número do professor com DDI, ex.: "5491112345678" (vazio = ela escolhe o contato)
const M=[
{t:"Sobrevivência no inglês",L:[
{t:"Verb to be",x:"<p>O <b>to be</b> (ser/estar) é o alicerce: em inglês toda frase precisa de verbo, então até onde o português dispensa (“ela é médica”), o inglês exige <b>is</b>. Formas: <b>I am</b>, <b>you/we/they are</b>, <b>he/she/it is</b>.</p><p><b class=say>I am from Brazil.</b> <b class=say>She is a student.</b> <b class=say>They are friends.</b></p>",q:[["She ___ a student.",["am","is","are"],1,"“She” é 3ª pessoa do singular (he/she/it), que usa <b>is</b>."],["We ___ from Brazil.",["is","am","are"],2,"“We” é plural, e plural (you/we/they) usa <b>are</b>."]]},
{t:"Present Simple",x:"<p>O <b>Present Simple</b> serve para rotinas e fatos. Com he/she/it o verbo ganha <b>-s</b>. Para negar e perguntar entra o auxiliar <b>do/does</b>, e o verbo volta ao normal, porque o <b>-s</b> já foi para o <b>does</b>.</p><p><b class=say>She works every day.</b> <b class=say>Does he study English?</b> <b class=say>I don't live here.</b></p>",q:[["He ___ English every day.",["study","studies","studys"],1,"3ª pessoa leva -s; consoante + y troca o y por <b>-ies</b>."],["___ she work here?",["Do","Does","Is"],1,"She pede <b>does</b>, e depois dele o verbo fica sem -s (work)."]]}],
T:[["I ___ 25 years old.",["is","are","am"],2,"Com “I” usamos sempre <b>am</b>."],["They ___ in Argentina.",["is","are","am"],1,"“They” é plural → <b>are</b>."],["She ___ coffee in the morning.",["drink","drinks","drinking"],1,"3ª pessoa no Present Simple leva -s."],["I ___ like tea.",["doesn't","don't","isn't"],1,"Com “I” usamos <b>don't</b>; <b>doesn't</b> é só para he/she/it."]]},
{t:"Construindo frases",L:[
{t:"There is / There are",x:"<p>Usamos <b>there is</b> (singular) e <b>there are</b> (plural) para dizer que algo <b>existe</b> ou está em algum lugar, como o “há/tem” do português. O verbo concorda com o que vem depois: uma coisa → is; duas ou mais → are.</p><p><b class=say>There is a hospital near here.</b> <b class=say>There are two restaurants.</b></p>",q:[["There ___ a park in my city.",["is","are","be"],0,"“a park” é singular → <b>is</b>."],["There ___ three books on the table.",["is","are","am"],1,"“three books” é plural → <b>are</b>."]]},
{t:"Past Simple",x:"<p>O <b>Past Simple</b> conta ações terminadas. Verbos regulares ganham <b>-ed</b> (worked); os irregulares mudam e precisam ser memorizados: go → <b>went</b>, see → <b>saw</b>, eat → <b>ate</b>, have → <b>had</b>. Em perguntas e negações, o <b>did</b> carrega o passado e o verbo volta ao normal.</p><p><b class=say>Yesterday I went to the university.</b> <b class=say>Did you eat lunch?</b></p>",q:[["Yesterday I ___ to the university.",["go","went","goed"],1,"<b>go</b> é irregular: o passado é <b>went</b>, não “goed”."],["She didn't ___ the movie.",["saw","see","seen"],1,"Depois de <b>didn't</b> o verbo volta ao normal, pois o passado já está no didn't."]]}],
T:[["Last weekend we ___ pizza.",["eat","ate","eated"],1,"<b>eat</b> é irregular → <b>ate</b>."],["___ there a bank near here?",["Are","Is","Do"],1,"“a bank” é singular → <b>Is there</b>…?"],["___ you study yesterday?",["Did","Do","Were"],0,"Passado + pergunta com verbo comum → <b>Did</b>."],["There ___ some students in the room.",["is","are","am"],1,"“some students” é plural → <b>are</b>."]]},
{t:"Inglês para situações reais",L:[
{t:"Futuro: going to × will",x:"<p><b>Going to</b> expressa um plano que você <b>já decidiu</b>; <b>will</b> expressa uma decisão tomada na hora ou uma promessa. A lógica: planejou antes → going to; foi impulso ou promessa → will.</p><p><b class=say>I'm going to study tonight.</b> <b class=say>I'll call you tomorrow.</b></p>",q:[["I bought the tickets, so I ___ travel next week.",["will","am going to","go"],1,"Já comprou as passagens: plano decidido → <b>going to</b>."],["“The phone is ringing!” — “I ___ answer it!”",["will","am going to","answer"],0,"Decisão tomada na hora → <b>will</b>."]]},
{t:"Modal verbs",x:"<p><b>Modais</b> (can, should, must) expressam habilidade, conselho ou obrigação. Regra de ouro: depois do modal o verbo fica <b>sem -s e sem to</b>. <b>Must</b> vem de dentro de você; <b>have to</b> vem de uma regra externa.</p><p><b class=say>I can speak English.</b> <b class=say>You should study more.</b> <b class=say>I have to work tomorrow.</b></p>",q:[["She can ___ very well.",["sings","sing","to sing"],1,"Depois de modal, o verbo fica na forma base: sem -s e sem to."],["You ___ study more if you want to improve.",["should","have","are"],0,"<b>should</b> dá conselho."]]}],
T:[["Which sentence is correct?",["He cans swim.","He can swims.","He can swim."],2,"O modal não leva -s, nem o verbo depois dele."],["I ___ work tomorrow. It's a company rule.",["have to","should to","can"],0,"Regra externa → <b>have to</b>."],["I ___ visit my grandma on Sunday. It's already planned.",["will","am going to","can"],1,"Plano já feito → <b>going to</b>."],["At the café: “___ I have a coffee, please?”",["Could","Am","Do"],0,"<b>Could</b> é o modal educado para pedir algo."]]},
{t:"Intermediário inicial",L:[
{t:"Present Continuous",x:"<p>O <b>Present Continuous</b> (<b>be + verbo-ing</b>) descreve o que acontece <b>agora</b> ou algo temporário. O Present Simple é a rotina; o Continuous é o momento: “I work every day” × “I'm working now”.</p><p><b class=say>She is reading a book now.</b> <b class=say>They are studying English.</b></p>",q:[["Be quiet! The baby ___.",["sleeps","is sleeping","sleep"],1,"Está acontecendo agora → <b>is sleeping</b>."],["I ___ to the gym every morning.",["go","am going","goes"],0,"“Every morning” indica rotina → Present Simple."]]},
{t:"Present Perfect",x:"<p>O <b>Present Perfect</b> (<b>have/has + particípio</b>) liga o passado ao presente: o que importa é o resultado agora, não o momento exato. Por isso não usamos “yesterday” com ele. <b>For</b> indica duração e <b>since</b> indica o ponto de partida.</p><p><b class=say>I have studied English for two years.</b> <b class=say>Have you ever been to Brazil?</b></p>",q:[["I have lived here ___ 2020.",["for","since","ago"],1,"2020 é um ponto de partida → <b>since</b>; <b>for</b> é duração (for 5 years)."],["She ___ never eaten sushi.",["have","has","is"],1,"“She” pede <b>has</b> + particípio (eaten)."]]}],
T:[["Look! It ___ right now.",["rains","is raining","has rain"],1,"“Right now” → Present Continuous."],["We ___ friends for ten years.",["are","have been","were"],1,"Duração até hoje com <b>for</b> → <b>have been</b> (have + particípio de be)."],["Have you ___ been to London?",["ever","yet","since"],0,"<b>ever</b> pergunta sobre experiências de vida."],["I haven't finished my homework ___.",["yet","since","ago"],0,"Em negativas, <b>yet</b> = “ainda”."]]},
{t:"Aumentando a fluência",L:[
{t:"Comparações",x:"<p>Adjetivos <b>curtos</b> ganham <b>-er</b> (bigger); os longos usam <b>more</b> (more interesting). Para o máximo: <b>the -est</b> / <b>the most</b>. A lógica é o ritmo: palavras curtas “cabem” no sufixo, as longas ficariam pesadas. Irregular: good → <b>better</b> → <b>the best</b>.</p><p><b class=say>This book is more interesting than that one.</b> <b class=say>She is the best student.</b></p>",q:[["My house is ___ than yours.",["more big","bigger","biggest"],1,"“Big” é curto → <b>bigger</b> (a consoante dobra)."],["This movie is ___ than the book.",["more interesting","interestinger","most interesting"],0,"Adjetivo longo → <b>more</b> + adjetivo."]]},
{t:"Conditionals",x:"<p>O <b>1st conditional</b> trata do <b>real e possível</b>: if + presente, <b>will</b> + verbo. O <b>2nd conditional</b> trata do <b>imaginário</b>: if + passado, <b>would</b> + verbo. Aqui o passado não marca tempo, marca “distância da realidade”.</p><p><b class=say>If I have time, I will call you.</b> <b class=say>If I were you, I would study more.</b></p>",q:[["If it rains tomorrow, we ___ at home.",["would stay","will stay","stayed"],1,"Situação real e possível → if + presente, <b>will</b>."],["If I ___ rich, I would travel the world.",["am","were","will be"],1,"Situação imaginária → if + passado (<b>were</b>) + would."]]}],
T:[["She is ___ student in the class.",["the best","the better","the goodest"],0,"Superlativo de good → <b>the best</b>."],["Today is ___ than yesterday.",["cold","colder","more cold"],1,"“Cold” é curto → <b>colder</b>."],["If I ___ you, I would accept the job.",["am","will be","were"],2,"Situação imaginária → <b>were</b>."],["If you study, you ___ the test.",["will pass","would pass","passed"],0,"Situação real → if + presente, <b>will</b>."]]},
{t:"Consolidação",L:[
{t:"Phrasal verbs",x:"<p><b>Phrasal verbs</b> são verbo + partícula, e a partícula muda o sentido: <b>look</b> = olhar, mas <b>look for</b> = procurar. Aprenda-os <b>inteiros</b>, como uma palavra só, e nunca traduzindo peça por peça.</p><p><b class=say>I wake up at 7.</b> <b class=say>Don't give up!</b> <b class=say>I'm looking for my keys.</b></p>",q:[["I'm ___ my keys. I can't find them.",["looking at","looking for","looking up"],1,"<b>look for</b> = procurar."],["Never ___! Keep trying.",["give up","give away","give back"],0,"<b>give up</b> = desistir; give away = doar; give back = devolver."]]},
{t:"Revisão: tempos verbais",x:"<p>Para escolher o tempo, pergunte: <b>quando?</b> Rotina → Present Simple; agora → Continuous; passado terminado → Past Simple; passado que ainda importa → Present Perfect; plano → going to. Procure as pistas: yesterday, now, for, since, tomorrow.</p><p><b class=say>I have lived here for 3 years.</b> <b class=say>I lived there in 2019.</b></p>",q:[["I ___ to Buenos Aires in 2019.",["have moved","moved","move"],1,"“In 2019” é um momento terminado → Past Simple."],["She ___ English since she was a child.",["studies","has studied","is studying"],1,"<b>Since</b> liga o passado ao presente → Present Perfect."]]}],
T:[["Right now, my sister ___ dinner.",["cooks","is cooking","cook"],1,"“Right now” → Present Continuous."],["I ___ never been to Japan.",["have","did","am"],0,"Experiência de vida → <b>have</b> + particípio."],["If I had more time, I ___ learn French.",["will","would","did"],1,"Situação imaginária → <b>would</b>."],["Please ___ your shoes before you enter.",["take off","take out","put on"],0,"<b>take off</b> = tirar (roupa, sapatos); <b>put on</b> é o contrário."]]}
];
const X=[
["hello|olá;goodbye|tchau;please|por favor;thank you|obrigado;sorry|desculpe;name|nome;country|país;job|trabalho;family|família;friend|amigo;teacher|professor;student|estudante","Apresente-se em inglês: seu nome, de onde você é, o que faz e como é um dia comum na sua rotina. Use o verbo to be e o Present Simple.",["Dizer “I have 25 years” por influência do português. Em inglês a idade usa to be: <b>I am 25 years old</b>.","Esquecer o -s na 3ª pessoa (“she work”) ou colocá-lo junto com does (“does she works?”). O -s aparece uma única vez."],[["Complete: My sister ___ a doctor.","is","“My sister” equivale a “she” (3ª pessoa do singular) → <b>is</b>."],["Escreva a forma correta: She (watch) TV at night.","watches","Verbos terminados em -ch, -sh, -s, -x e -o ganham <b>-es</b>."]],["He ___ like coffee. (negativo)","doesn't|does not","Negativo com he/she/it → <b>doesn't</b> + verbo base."]],
["house|casa;city|cidade;street|rua;hospital|hospital;restaurant|restaurante;bank|banco;yesterday|ontem;last week|semana passada;weekend|fim de semana;vacation|férias;childhood|infância;went|fui (passado de go)","Escreva cerca de 60 palavras sobre o que você fez no último fim de semana, usando o Past Simple.",["Usar “there is” com plural (“there is two cars”). Olhe o substantivo: dois ou mais pedem <b>there are</b>.","Marcar o passado duas vezes (“did you went?”). Com <b>did</b> o verbo volta à base: <b>did you go?</b>"],[["Complete: There ___ many people in the park.","are","“many people” é plural → <b>are</b>."],["Passado de “eat”:","ate","<b>eat</b> é irregular: eat, <b>ate</b>, eaten."]],["Passado de “have”:","had","<b>have</b> → <b>had</b> (irregular)."]],
["ticket|passagem;luggage|bagagem;airport|aeroporto;reservation|reserva;check-in|registro de entrada;menu|cardápio;bill|conta;receipt|recibo;how much|quanto custa;excuse me|com licença;could you help me|você poderia me ajudar;I would like|eu gostaria","Escreva um diálogo de cerca de 60 palavras entre você e um atendente de hotel no check-in. Use can, could e would like.",["Usar will para tudo. Se o plano já existe, prefira <b>going to</b>; will é para decisão na hora e promessa.","Dizer “can to speak” ou “she cans”. Modal não leva to nem -s."],[["Complete: Look at those clouds! It ___ rain.","is going to","Há evidência no presente (nuvens) → <b>going to</b>; com “it” usa-se <b>is</b>."],["Complete: You ___ see a doctor. (conselho)","should","<b>should</b> dá conselho."]],["___ you help me, please? (pedido educado)","could|can|would","<b>Could</b> (ou can/would) abre um pedido educado."]],
["right now|agora mesmo;at the moment|neste momento;already|já;yet|ainda (negativas e perguntas);ever|alguma vez;never|nunca;since|desde;for|por, durante;recently|recentemente;just|acabou de;been|particípio de be;done|feito","Escreva cerca de 60 palavras sobre o que você está fazendo agora e algo que já fez ou nunca fez na vida. Use Present Continuous e Present Perfect.",["Usar o Continuous para rotina (“I am going to work every day”). Rotina pede Present Simple.","Usar Present Perfect com passado terminado (“I have seen him yesterday”). Com yesterday, use Past Simple."],[["Complete: They ___ soccer right now. (play)","are playing","Agora → be + verbo-ing: <b>are playing</b>."],["Particípio de “write”:","written","write, wrote, <b>written</b>."]],["Complete: I ___ never seen snow.","have","Com “I” usa-se <b>have</b> + particípio."]],
["bigger|maior;smaller|menor;better|melhor;worse|pior;the best|o melhor;the worst|o pior;expensive|caro;cheap|barato;if|se;would|condicional (ia, iria);unless|a menos que;maybe|talvez","Escreva cerca de 60 palavras comparando duas cidades que você conhece e o que faria se morasse em uma delas (2nd conditional).",["Usar “more” com adjetivo curto (“more big”) ou duas comparações juntas (“more bigger”). Escolha só uma forma.","Colocar will depois do if (“if it will rain”). Depois do if, o 1st conditional usa o presente."],[["Complete: This bag is ___ than that one. (cheap)","cheaper","“cheap” é curto → <b>cheaper</b>."],["Complete: If I ___ time, I will call you. (have)","have","Real e possível → if + presente: <b>have</b>."]],["Complete: She is the ___ player in the team. (good)","best","Superlativo irregular de good: <b>best</b>."]],
["wake up|acordar;get up|levantar-se;give up|desistir;look for|procurar;find out|descobrir;come back|voltar;go out|sair;take off|tirar, decolar;put on|vestir, colocar;turn on|ligar;turn off|desligar;pick up|pegar","Escreva cerca de 60 palavras sobre sua evolução no inglês e seus planos. Use pelo menos dois phrasal verbs e dois tempos verbais diferentes.",["Traduzir o phrasal verb palavra por palavra. <b>Give up</b> não é “dar para cima”: é desistir. Memorize o conjunto.","Escolher o tempo pela tradução. Identifique a pista (yesterday, now, since) antes de decidir."],[["Complete: Please ___ the lights. (desligar)","turn off","<b>turn off</b> = desligar; <b>turn on</b> = ligar."],["Complete: I ___ here since 2020. (live)","have lived","<b>since</b> → Present Perfect: <b>have lived</b>."]],["Complete: I usually ___ at seven. (acordar)","wake up","Rotina com “I” → Present Simple: <b>wake up</b>."]]];

function home(){const n=next();show(`<h1>Painel</h1><p class=mut>${MSG}</p><div class=card><div class=hd><b>Progresso geral</b><span>${pct()}%</span></div><div class=bar><i style="width:${pct()}%"></i></div><p class=mut style="margin:8px 0 0">Sequência: ${stk()} dia(s) · Exercícios hoje: ${today()}/10 · Revisões pendentes: ${due().length}</p></div>${n?`<button class=btn data-a=${n[0]} data-p="${n[1]}">Continuar: ${n[2]}</button>`:"<p><b>Você concluiu todos os módulos.</b></p>"}<h2>Módulos</h2>`+M.map((m,i)=>`<button class=row data-a=mod data-p="${i}"><span><b>Módulo ${i+1}</b>: ${m.t}</span><span class=mut>${m.L.filter((_,j)=>S.d[i+"-"+j]).length}/${m.L.length} lições · ${S.t[i]>=75?"Aprovada":"Prova pendente"}</span></button>`).join(""),"h")}
function mod(i){const m=M[i];show(`<h1>Módulo ${i+1}: ${m.t}</h1><p class=mut>${m.L.length} lições, vocabulário, tarefa de escrita e prova final.</p><h3>Lições</h3>${m.L.map((l,j)=>`<button class=row data-a=les data-p="${i},${j}"><span>${l.t}</span><span class=mut>${S.d[i+"-"+j]?"Concluída":"Pendente"}</span></button>`).join("")}<h3 style="margin-top:24px">Prática</h3><button class=row data-a=voc data-p="${i}"><span>Vocabulário (${m.V.length} cartões)</span><span class=mut>Abrir</span></button><button class=row data-a=wr data-p="${i}"><span>Tarefa de escrita</span><span class=mut>${S.w[i]?"Rascunho salvo":"Abrir"}</span></button><button class=row data-a=test data-p="${i}"><span>Prova do módulo</span><span class=mut>${S.t[i]!=null?"Melhor: "+S.t[i]+"%":"Não feita"}</span></button>`,""+i)}
function quiz(it,inst,done){const el=document.getElementById("qz"),a=[],L=new Set,ty=q=>typeof q[1]=="string",n=()=>a.filter(x=>x!=null&&x!=="").length,ok=(q,v)=>ty(q)?q[1].split("|").includes(nm(v)):v===q[2],sc=()=>Math.round(it.filter((o,k)=>a[k]!=null&&ok(o.q,a[k])).length/it.length*100),ix=c=>[...el.children].indexOf(c);
el.innerHTML=it.map((o,k)=>{const q=o.q;return `<div class=card><b>${k+1}. ${q[0]}</b>${ty(q)?`<input class=inp placeholder="Digite sua resposta" autocomplete=off autocapitalize=off>${inst?'<button class="btn g chk">Verificar</button>':""}`:q[1].map((x,y)=>`<button class=opt data-x=${y}>${x}</button>`).join("")}<div class=why hidden></div></div>`}).join("")+(inst?"":"<button class=btn id=fin>Finalizar prova</button>");
const rev=k=>{const c=el.children[k],q=it[k].q,g=ok(q,a[k]),w=c.querySelector(".why");if(ty(q)){const i=c.querySelector(".inp");i.disabled=true;i.classList.add(g?"ok":"no");w.innerHTML="Resposta: <b>"+q[1].split("|")[0]+"</b>. "+q[2];const b=c.querySelector(".chk");if(b)b.hidden=true}else{c.querySelectorAll(".opt").forEach((o,x)=>{o.classList.remove("sel");o.classList.toggle("ok",x==q[2]);o.classList.toggle("no",x==a[k]&&x!=q[2])});w.innerHTML=q[3]}w.hidden=false;mark(it[k].id,g)};
el.onclick=e=>{if(el.dataset.l)return;const b=e.target.closest(".opt,.chk");if(!b)return;const c=b.parentNode,k=ix(c);if(inst&&L.has(k))return;if(b.classList.contains("chk")){a[k]=nm(c.querySelector(".inp").value);if(!a[k])return}else{a[k]=+b.dataset.x;c.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o===b))}if(inst){L.add(k);rev(k);n()==it.length&&done(sc())}};
el.oninput=e=>{if(!inst)a[ix(e.target.parentNode)]=nm(e.target.value)};
el.onkeydown=e=>{if(e.key=="Enter"&&e.target.classList.contains("inp")){const b=e.target.parentNode.querySelector(".chk");b&&b.click()}};
const f=document.getElementById("fin");if(f)f.onclick=()=>{if(n()<it.length){f.textContent="Responda todas as questões para finalizar";return}el.dataset.l=1;f.remove();it.forEach((_,k)=>rev(k));done(sc())}}
function les(i,j){const l=M[i].L[j];show(`<p class=mut>Módulo ${i+1} · Lição ${j+1} de ${M[i].L.length}</p><h1>${l.t}</h1><div class=card>${l.x}<p class=mut style="margin:14px 0 0">Clique nas frases sublinhadas para ouvir a pronúncia.</p></div><h2>Exercícios</h2><div id=qz></div><div id=nx></div>`,i+"l");
quiz(l.q.map((q,k)=>({id:`${i}.${j}.${k}`,q})),1,()=>{S.d[i+"-"+j]=1;sv();side();const last=j+1>=M[i].L.length,x=document.getElementById("nx");x.innerHTML=`<div class="card res"><b>Lição concluída.</b><p>Os erros desta lição voltarão na revisão espaçada. Repetir em voz alta as frases dos exemplos acelera a fixação.</p><button class=btn data-a=${last?"test":"les"} data-p="${last?i:i+","+(j+1)}">${last?"Fazer a prova do módulo":"Próxima lição"}</button></div>`;x.scrollIntoView({behavior:"smooth"})})}
function test(i){const m=M[i];show(`<h1>Prova: ${m.t}</h1><div class=card><p>${m.T.length} questões. Aprovação com 75% ou mais. As explicações aparecem ao finalizar, e os erros entram na revisão espaçada.</p></div><div id=qz></div><div id=nx></div>`,i+"t");
quiz(m.T.map((q,k)=>({id:`${i}.t.${k}`,q})),0,s=>{S.t[i]=Math.max(S.t[i]||0,s);sv();side();const ok=s>=75,x=document.getElementById("nx");x.innerHTML=`<div class="card res"><h2 style="margin-top:0">${ok?"Aprovada, Laisla!":"Quase lá"}</h2><p>Você acertou <b>${s}%</b>. ${ok?"Módulo concluído. Você está cada vez mais perto do B1.":"Releia as explicações, revise as lições e tente de novo. Errar faz parte de aprender."}</p><button class=btn data-a=${ok?"home":"test"} data-p="${ok?"":i}">${ok?"Voltar ao painel":"Tentar novamente"}</button></div>`;x.scrollIntoView({behavior:"smooth"})})}
function rv(){const d=due();show(`<h1>Revisão espaçada</h1><p class=mut>Questões erradas voltam depois de 1, 3, 7 e 14 dias de acertos seguidos: o intervalo em que o esquecimento começa e a revisão fixa mais.</p>${d.length?"<div id=qz></div><div id=nx></div>":"<div class=card>Nada para revisar hoje. As questões que você errar aparecerão aqui.</div>"}`,"r");
if(d.length)quiz(d.map(id=>({id,q:Q(id)})),1,()=>{document.getElementById("nx").innerHTML=`<div class="card res"><b>Revisão concluída.</b><p>Os acertos ganham um intervalo maior; os erros voltam amanhã.</p><button class=btn data-a=home>Ir ao painel</button></div>`;side()})}
function voc(i){const m=M[i];let q=m.V.map((_,k)=>k),f=false;show(`<h1>Vocabulário: ${m.t}</h1><div class=card id=fc></div>`,i+"v");
const draw=()=>{const c=document.getElementById("fc");if(!q.length){c.innerHTML=`<p><b>Deck concluído.</b> Repita em voz alta as palavras que ainda geram dúvida.</p><button class=btn data-a=mod data-p="${i}">Voltar ao módulo</button>`;return}const[w,t]=m.V[q[0]].split("|");c.innerHTML=`<button class=fc data-k=flip>${f?t:w}</button><p class=mut>${f?"Tradução":"Clique no cartão para ver a tradução"} · restam ${q.length}</p><button class="btn g" data-k=say>Ouvir</button> <button class="btn g" data-k=later>Revisar depois</button> <button class=btn data-k=know>Já sei</button>`};draw();
document.getElementById("fc").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;if(k=="say")return say(m.V[q[0]].split("|")[0]);if(k=="flip")f=!f;else{f=false;if(k=="know"){q.shift();act();side()}else q.push(q.shift())}draw()}}
function wr(i){show(`<h1>Tarefa de escrita</h1><p class=mut>Módulo ${i+1}: ${M[i].t}</p><div class=card><p>${M[i].W}</p><textarea class=inp id=tx rows=9 placeholder="Escreva aqui em inglês..."></textarea><p class=mut id=wc></p><button class=btn id=snd>Enviar ao professor pelo WhatsApp</button></div><p class=mut>O rascunho é salvo automaticamente neste dispositivo.</p>`,i+"w");
const t=document.getElementById("tx"),c=document.getElementById("wc"),u=()=>{c.textContent=(t.value.trim()?t.value.trim().split(/\s+/).length:0)+" palavras (meta: 60)"};t.value=S.w[i]||"";u();t.oninput=()=>{S.w[i]=t.value;sv();u()};
document.getElementById("snd").onclick=()=>open("https://wa.me/"+WPP+"?text="+encodeURIComponent("Laisla, Módulo "+(i+1)+", escrita:\n\n"+t.value),"_blank")}
function cert(){const f=M.filter((_,i)=>!(S.t[i]>=75)).length;show(f?`<h1>Certificado</h1><p>Disponível quando você for aprovada em todas as provas (75% ou mais). Faltam ${f} módulo(s).</p>`:`<div class=card style="text-align:center;padding:48px 24px"><img class=lg src="${LOGO}" alt="" style="width:100px;height:100px;margin-bottom:12px"><p class=mut>Certificado de conclusão</p><h1>Laisla</h1><p>concluiu com aprovação os seis módulos do curso Laisla's English Journey.</p><p class=mut>${new Date().toLocaleDateString("pt-BR")}</p></div><button class=btn data-a=prt>Imprimir ou salvar em PDF</button>`,"c")}
function th(t){R.dataset.theme=t;try{localStorage.lth=t}catch(e){}side()}
const A={home,mod,les,test,voc,wr,rv,cert,prt:()=>print(),menu:()=>SB.classList.toggle("o"),thm:()=>th(R.dataset.theme=="dark"?"light":"dark")};
document.addEventListener("click",e=>{const s=e.target.closest(".say");if(s)return say(s.textContent);const b=e.target.closest("[data-a]");if(b){A[b.dataset.a](...(b.dataset.p||"").split(",").filter(x=>x!=="").map(Number));if(b.dataset.a!="menu"&&b.dataset.a!="thm")scrollTo(0,0)}});
let t0;try{t0=localStorage.lth}catch(e){}const h=new Date().getHours();
th(t0||"light");home();
</script></body></html>
