<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>English Journey — Curso Semestral</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--primary:#4f46e5;--primary2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb;--shadow:0 10px 30px #11182712}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
button{font:inherit;cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:290px;background:#111827;color:white;padding:24px 16px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-size:22px;font-weight:800;padding:8px 10px 22px}.brand span{color:#a5b4fc}.side-title{font-size:11px;text-transform:uppercase;color:#9ca3af;margin:18px 10px 8px;letter-spacing:.08em}.nav button{display:block;width:100%;border:0;background:transparent;color:#d1d5db;text-align:left;padding:10px 12px;border-radius:10px;margin:2px 0}.nav button:hover,.nav button.active{background:#312e81;color:#fff}.main{margin-left:290px;width:calc(100% - 290px);padding:32px;max-width:1400px}.hero{background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff;border-radius:22px;padding:34px;box-shadow:var(--shadow);margin-bottom:24px}.hero h1{font-size:38px;margin:0 0 8px}.hero p{margin:0;max-width:760px;color:#e9e7ff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}.stat{background:#ffffff18;border:1px solid #ffffff25;padding:15px;border-radius:14px}.stat b{display:block;font-size:23px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.card h2,.card h3{margin-top:0}.muted{color:var(--muted)}.progress{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0}.week-card{display:flex;flex-direction:column;gap:12px}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:700}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--primary);color:white;font-weight:700}.btn.secondary{background:#eef2ff;color:#3730a3}.btn.ghost{background:#f3f4f6;color:#374151}.lesson{max-width:900px}.lesson h1{font-size:32px}.section{margin:18px 0}.example{background:#f8fafc;border-left:4px solid var(--primary);padding:15px;border-radius:8px}.tip{background:#ecfdf5;border-left:4px solid var(--ok);padding:15px;border-radius:8px}.exercise{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:14px}.options{display:grid;gap:8px}.option{padding:11px;border:1px solid var(--line);border-radius:10px;background:white;text-align:left}.option.correct{border-color:var(--ok);background:#f0fdf4}.option.wrong{border-color:var(--bad);background:#fef2f2}.feedback{margin-top:10px;font-weight:700}.input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;margin:8px 0}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:13px 17px;border-radius:12px;display:none}.week-nav{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.week-nav button{white-space:nowrap;border:1px solid var(--line);background:white;padding:8px 12px;border-radius:9px}.week-nav button.done{background:#ecfdf5;border-color:#bbf7d0;color:#166534}.quiz-score{font-size:28px;font-weight:800}.small{font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}@media(max-width:900px){.sidebar{width:230px}.main{margin-left:230px;width:calc(100% - 230px);padding:18px}.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:650px){.sidebar{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%}.grid,.stats{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">English <span>Journey</span> 🇬🇧</div>
  <div class="nav">
    <button onclick="showHome()" id="navHome">🏠 Dashboard</button>
    <div class="side-title">Curso</div>
    <button onclick="showWeeks()">📚 24 semanas</button>
    <button onclick="showVocabulary()">🧠 Vocabulário</button>
    <button onclick="showReview()">🔄 Revisão</button>
    <button onclick="showFinal()">🎓 Prova final</button>
  </div>

</aside>

<main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const weeks = [
{w:1,title:"Primeiros passos",topic:"Verb to be + apresentação",level:"A1",goals:["Usar I / you / he / she / we / they","Apresentar-se","Falar país, profissão e informações básicas"],explain:"O verbo <b>to be</b> significa ser/estar. No presente, usamos <b>am</b> com I, <b>is</b> com he/she/it e <b>are</b> com you/we/they.",examples:["I am João. = Eu sou João.","She is a student. = Ela é estudante.","They are from Brazil. = Eles são do Brasil."],vocab:["name","country","city","student","doctor","friend","family","Brazil","Argentina","English"],quiz:[["I ___ a student.",["am","is","are"],0],["She ___ from Brazil.",["am","is","are"],1],["They ___ friends.",["am","is","are"],2]]},
{w:2,title:"Minha rotina",topic:"Present Simple",level:"A1",goals:["Falar sobre hábitos","Usar do/does","Formar negativas simples"],explain:"O <b>Present Simple</b> é usado para hábitos e fatos. Com he/she/it, normalmente acrescentamos <b>-s</b> ao verbo.",examples:["I study every day.","She works at a hospital.","Do you study English?","He doesn't work on Sunday."],vocab:["wake up","study","work","eat","drink","sleep","go","come","every day","usually"],quiz:[["She ___ English every day.",["study","studies","studying"],1],["___ you work here?",["Do","Does","Are"],0],["He ___ like coffee.",["don't","doesn't","isn't"],1]]},
{w:3,title:"Perguntas",topic:"Question words",level:"A1",goals:["Fazer perguntas","Entender What/Where/When/Who/Why/How","Manter uma conversa curta"],explain:"As <b>question words</b> ajudam a descobrir informações. What = o quê/qual; Where = onde; When = quando; Who = quem; Why = por quê; How = como.",examples:["What is your name?","Where do you live?","What do you do?","How are you?"],vocab:["what","where","when","who","why","how","how much","how many"],quiz:[["___ do you live?",["Who","Where","Why"],1],["___ is your name?",["What","When","Where"],0],["___ are you?",["How","Who","What"],0]]},
{w:4,title:"Revisão A1",topic:"Integração + Prova 1",level:"A1",goals:["Revisar semanas 1–3","Fazer uma apresentação de 1 minuto","Consolidar perguntas básicas"],explain:"Esta semana é de consolidação. A regra mais importante é conseguir <b>usar</b> o que estudou, não apenas reconhecer a regra.",examples:["Hello! My name is Ana. I am from Brazil. I live in São Paulo. I am a student. I study English every day."],vocab:["hello","nice","meet","live","study","work","today","every","day","English"],quiz:[["My name ___ Ana.",["am","is","are"],1],["Where ___ you live?",["do","does","are"],0],["She ___ a doctor.",["am","is","are"],1]]},
{w:5,title:"Minha casa e minha cidade",topic:"There is / There are",level:"A1",goals:["Descrever lugares","Usar singular e plural","Falar sobre objetos"],explain:"Usamos <b>there is</b> para uma coisa e <b>there are</b> para duas ou mais.",examples:["There is a hospital near my house.","There are two parks in my city.","Is there a bank here?"],vocab:["house","room","kitchen","street","hospital","school","park","bank","store","city"],quiz:[["___ a hospital near here.",["There are","There is","It are"],1],["___ three rooms.",["There is","There are","There am"],1],["There ___ a park.",["is","are","am"],0]]},
{w:6,title:"Ontem",topic:"Past Simple",level:"A2",goals:["Falar sobre ações terminadas","Usar verbos regulares e irregulares","Reconhecer did"],explain:"O <b>Past Simple</b> descreve ações terminadas no passado. Verbos regulares geralmente recebem -ed. Muitos verbos são irregulares: go → went, eat → ate, see → saw.",examples:["I studied yesterday.","She went to the university.","Did you work yesterday?","I didn't go out."],vocab:["yesterday","last week","went","saw","ate","had","made","studied","worked","visited"],quiz:[["Yesterday I ___ to school.",["go","went","going"],1],["She ___ English last night.",["studied","study","studies"],0],["Did you ___ the movie?",["saw","see","seen"],1]]},
{w:7,title:"Falando do passado",topic:"Past Simple — conversation",level:"A2",goals:["Contar o que aconteceu","Usar marcadores de tempo","Responder perguntas no passado"],explain:"Para contar histórias simples, combine sujeito + verbo no passado + complemento. Use <b>yesterday, last night, last weekend</b> para deixar o contexto claro.",examples:["Last weekend I stayed home.","I watched a movie and studied English.","Then I went to bed."],vocab:["last weekend","last night","then","after","before","morning","afternoon","night","visited","watched"],quiz:[["Last night I ___ a movie.",["watch","watched","watching"],1],["We ___ dinner at 8.",["have","had","has"],1],["Then I ___ home.",["went","go","goes"],0]]},
{w:8,title:"Prova 2",topic:"A1/A2 — passado e rotina",level:"A2",goals:["Revisar semanas 5–7","Escrever 100 palavras","Falar por 2 minutos"],explain:"Faça a prova sem consultar as aulas. Depois, revise somente os erros.",examples:["Writing prompt: Describe your last weekend in 80–100 words."],vocab:["weekend","because","but","then","also","first","finally","yesterday"],quiz:[["There ___ two students.",["is","are","am"],1],["I ___ my friend yesterday.",["visit","visited","visits"],1],["Did she ___ home?",["went","go","goes"],1]]},
{w:9,title:"Planos",topic:"Future — going to / will",level:"A2",goals:["Falar de planos","Distinguir intenção e decisão rápida","Falar do futuro"],explain:"<b>Be going to</b> é muito usado para planos/intenção. <b>Will</b> também fala do futuro e aparece muito em decisões, promessas e previsões.",examples:["I'm going to study tonight.","We're going to travel next month.","I'll help you.","I think it will rain."],vocab:["tomorrow","next week","plan","travel","study","visit","learn","start","finish","future"],quiz:[["I'm ___ study tonight.",["going to","go to","will to"],0],["I think it ___ be easy.",["is","will","going"],1],["We are going to ___ tomorrow.",["travel","travels","traveling"],0]]},
{w:10,title:"Posso, devo, preciso",topic:"Modal verbs",level:"A2",goals:["Usar can/could/should/must","Dar conselhos","Expressar obrigação"],explain:"<b>Can</b> = capacidade; <b>could</b> = poderia; <b>should</b> = deveria; <b>must</b> = obrigação forte.",examples:["I can speak English.","Could you help me?","You should practice.","You must be careful."],vocab:["can","could","should","must","have to","need","help","practice","careful","important"],quiz:[["You ___ study more.",["should","can","mustn't"],0],["___ you help me?",["Could","Must","Should"],0],["I ___ speak a little English.",["can","must","should"],0]]},
{w:11,title:"Inglês para viajar",topic:"Situações reais",level:"A2",goals:["Check-in","Restaurante","Pedir informação"],explain:"Aqui o objetivo é memorizar <b>blocos de linguagem</b>, não traduzir palavra por palavra.",examples:["I'd like a coffee, please.","Where is the bathroom?","Can I have the bill, please?","I'd like to check in."],vocab:["airport","boarding pass","hotel","reservation","menu","bill","bathroom","ticket","room","passport"],quiz:[["In a restaurant: “I'd like ___ coffee.”",["a","an","the"],0],["At a hotel: “I'd like to ___ in.”",["check","go","make"],0],["Can I have the ___, please?",["bill","room","passport"],0]]},
{w:12,title:"Prova do Módulo 1",topic:"A1 → A2",level:"A2",goals:["Grammar","Listening guiado","Writing 150 palavras","Speaking 5 minutos"],explain:"Você já consegue construir uma base funcional. Agora a meta é falar com menos tradução mental.",examples:["Speaking: introduce yourself, describe your routine, and tell what you did last weekend."],vocab:["introduce","routine","experience","weekend","plan","because","however","usually"],quiz:[["She ___ every day.",["study","studies","studied"],1],["I ___ there yesterday.",["go","went","will go"],1],["We are ___ to travel.",["going","go","went"],0]]},
{w:13,title:"O que está acontecendo?",topic:"Present Continuous",level:"A2",goals:["Descrever ações agora","Diferenciar rotina de ação momentânea","Usar am/is/are + ing"],explain:"O <b>Present Continuous</b> é formado por <b>am/is/are + verbo-ing</b> e é muito usado para algo acontecendo agora.",examples:["I am studying now.","She is working.","They are watching TV."],vocab:["now","right now","today","working","studying","watching","reading","speaking"],quiz:[["I ___ studying now.",["am","is","are"],0],["They ___ watching TV.",["am","is","are"],2],["She is ___ English.",["study","studies","studying"],2]]},
{w:14,title:"Duas ações no passado",topic:"Past Continuous",level:"A2",goals:["Descrever contexto","Combinar past simple + past continuous","Usar while/when"],explain:"O <b>Past Continuous</b> mostra uma ação em andamento no passado. É comum combiná-lo com uma ação que interrompeu o processo.",examples:["I was studying when she called.","They were sleeping when the phone rang."],vocab:["while","when","called","rang","sleeping","studying","walking","happened"],quiz:[["I ___ studying when she called.",["was","were","am"],0],["They ___ sleeping.",["was","were","is"],1],["She was ___ when I arrived.",["work","worked","working"],2]]},
{w:15,title:"Experiências de vida",topic:"Present Perfect",level:"B1",goals:["Usar have/has + particípio","Falar de experiências","Usar ever/never/just/already/yet"],explain:"O <b>Present Perfect</b> conecta passado e presente. É usado, entre outras coisas, para experiências sem especificar quando.",examples:["I have visited Argentina.","Have you ever been to Brazil?","She has never tried sushi.","I have already finished."],vocab:["ever","never","already","yet","just","experience","visited","tried","finished","been"],quiz:[["I have ___ to Argentina.",["go","went","been"],2],["Have you ___ visited Brazil?",["ever","never","yet"],0],["She has ___ finished.",["already","ago","last"],0]]},
{w:16,title:"Prova 3",topic:"Tempos verbais",level:"B1",goals:["Comparar tempos","Escolher o tempo correto","Produzir respostas maiores"],explain:"Nesta prova, pense primeiro no <b>tempo da ação</b>: rotina, agora, passado terminado, ação em andamento ou experiência.",examples:["Choose based on context, not on memorization alone."],vocab:["present","past","future","continuous","perfect","habit","experience"],quiz:[["I ___ English every day.",["study","am studying","studied"],0],["I ___ English now.",["study","am studying","have studied"],1],["I ___ English yesterday.",["study","studied","am studying"],1]]},
{w:17,title:"Comparar",topic:"Comparatives & superlatives",level:"B1",goals:["Comparar pessoas e coisas","Usar better/worse","Usar the best"],explain:"Adjetivos curtos frequentemente usam <b>-er</b> e <b>-est</b>. Outros usam <b>more/most</b>. Alguns são irregulares: good → better → best.",examples:["English is easier than I expected.","This is better.","She is the best student in the class."],vocab:["better","worse","easier","harder","bigger","smaller","more interesting","the best"],quiz:[["English is ___ than I thought.",["easy","easier","easiest"],1],["This is the ___ option.",["better","best","good"],1],["My English is ___ now.",["better","best","good"],0]]},
{w:18,title:"Se...",topic:"Conditionals",level:"B1",goals:["Falar de consequências","Dar conselhos","Usar first/second conditional básico"],explain:"O <b>first conditional</b> fala de situações possíveis: If + present, will + verb. O <b>second conditional</b> fala de situações hipotéticas: If + past, would + verb.",examples:["If I study, I will improve.","If I had more time, I would travel."],vocab:["if","unless","would","could","improve","practice","time","chance"],quiz:[["If I study, I ___ improve.",["will","would","am"],0],["If I had time, I ___ travel.",["will","would","am"],1],["If you practice, you ___ improve.",["will","would","were"],0]]},
{w:19,title:"Phrasal verbs",topic:"Verbos do dia a dia",level:"B1",goals:["Reconhecer phrasal verbs","Aprender 10 essenciais","Entender contexto"],explain:"Phrasal verbs são combinações de verbo + partícula. Aprenda a expressão inteira, não traduções isoladas.",examples:["wake up = acordar","get up = levantar","go out = sair","look for = procurar","find out = descobrir","give up = desistir"],vocab:["wake up","get up","go out","come back","look for","find out","give up","put on","take off","pick up"],quiz:[["“Give up” means:",["desistir","acordar","procurar"],0],["“Look for” means:",["encontrar","procurar","sair"],1],["“Wake up” means:",["vestir","acordar","voltar"],1]]},
{w:20,title:"Conversação",topic:"Fluency practice",level:"B1",goals:["Falar por 5–10 minutos","Fazer perguntas de retorno","Usar conectores"],explain:"Fluência inicial não significa falar sem erros. Significa conseguir <b>continuar a comunicação</b> mesmo quando falta uma palavra.",examples:["In my opinion...","I think that...","For example...","Actually...","It depends...","What about you?"],vocab:["opinion","actually","however","because","although","for example","I think","in my opinion"],quiz:[["“What about you?” is used to:",["encerrar","perguntar a opinião/experiência do outro","pedir dinheiro"],1],["“In my opinion” introduces:",["uma opinião","uma pergunta","um lugar"],0],["“For example” introduces:",["um exemplo","uma dúvida","um passado"],0]]},
{w:21,title:"Listening",topic:"Entender sem traduzir tudo",level:"B1",goals:["Captar ideia principal","Identificar palavras-chave","Ouvir novamente com propósito"],explain:"Não tente entender 100%. Na primeira audição, descubra o tema. Na segunda, procure detalhes. Na terceira, confirme as palavras difíceis.",examples:["1ª vez: What is it about? 2ª: Who/where/when? 3ª: What did I miss?"],vocab:["main idea","detail","keyword","speaker","conversation","announcement"],quiz:[["Na primeira audição, foque em:",["cada palavra","ideia principal","gramática"],1],["Na segunda, procure:",["detalhes","tradução completa","apenas verbos"],0],["Listening melhora com:",["uma única audição","repetição com objetivo","evitar áudio"],1]]},
{w:22,title:"Speaking",topic:"Conversa guiada",level:"B1",goals:["Responder sem traduzir palavra por palavra","Usar conectores","Fazer perguntas"],explain:"Use estruturas prontas para ganhar velocidade. Depois substitua partes da frase por informações novas.",examples:["I usually... / Last weekend I... / Next month I'm going to... / I think... because..."],vocab:["usually","recently","next month","because","although","probably","maybe","definitely"],quiz:[["“I usually…” is useful for:",["hábitos","passado específico","hipóteses"],0],["“Last weekend…” signals:",["futuro","passado","presente"],1],["“Next month…” signals:",["futuro","passado","presente contínuo"],0]]},
{w:23,title:"Reading + Writing",topic:"Textos reais simples",level:"B1",goals:["Identificar ideia principal","Escrever 200 palavras","Organizar parágrafos"],explain:"Um texto bom tem começo, desenvolvimento e conclusão. Use conectores para ligar as ideias.",examples:["First,... Then,... However,... Because..., Finally,..."],vocab:["first","then","however","therefore","finally","although","also","because"],quiz:[["“However” indica:",["contraste","causa","exemplo"],0],["“Finally” indica:",["início","conclusão/última etapa","causa"],1],["“Because” indica:",["causa","contraste","tempo"],0]]},
{w:24,title:"🎓 Prova final",topic:"Avaliação do semestre",level:"B1",goals:["Grammar","Reading","Listening","Writing","Speaking"],explain:"Parabéns. A prova final mede sua capacidade de <b>usar</b> o inglês. Não procure perfeição: procure comunicação clara.",examples:["Speaking: 10 min. Writing: 200 words. Grammar: 40 questions. Reading + listening."],vocab:["progress","confidence","goal","practice","conversation","understand","communicate"],quiz:[["The main goal of this course is to:",["memorize rules only","communicate in English","avoid speaking"],1],["After 24 weeks you should be able to:",["never make mistakes","maintain basic conversations","understand every accent"],1],["The best way to improve is:",["practice consistently","study once a month","only memorize words"],0]}
];
const key="englishJourneyProgress";
let progress=JSON.parse(localStorage.getItem(key)||"{}");
function save(){localStorage.setItem(key,JSON.stringify(progress));updateSide();}
function updateSide(){let done=Object.values(progress).filter(Boolean).length;let pct=Math.round(done/24*100);document.getElementById("sideProgress").textContent=pct+"% concluído";document.getElementById("sideBar").style.width=pct+"%";}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
function showHome(){
 document.getElementById("main").innerHTML=`<section class="hero"><h1>English Journey 🇬🇧</h1><p>Um curso semestral interativo para estudar inglês como se fosse uma disciplina: aulas curtas, exemplos, exercícios, revisões e provas.</p><div class="stats"><div class="stat"><b>24</b>semanas</div><div class="stat"><b>A1 → B1</b>meta</div><div class="stat"><b>7</b>disciplinas</div><div class="stat"><b id="heroPct">0%</b>concluído</div></div></section>
 <div class="grid">
 <div class="card"><h2>🎯 Como estudar</h2><p>Faça uma semana por vez. Leia a explicação, repita os exemplos em voz alta, faça o quiz e marque a aula como concluída.</p><button class="btn" onclick="showWeek(1)">Começar semana 1</button></div>
 <div class="card"><h2>🗣️ Regra de ouro</h2><p>Seu objetivo não é decorar inglês. É <b>usar inglês</b>. Fale, escreva e tente responder antes de olhar a tradução.</p></div>
 <div class="card"><h2>💾 Progresso</h2><p>O progresso é salvo automaticamente neste navegador. O site funciona offline depois de carregado.</p><button class="btn secondary" onclick="showWeeks()">Ver todas as semanas</button></div></div>
 <div class="card" style="margin-top:18px"><h2>📅 Estrutura semanal</h2><table class="table"><tr><th>Dia</th><th>Atividade</th></tr><tr><td>Segunda</td><td>Gramática + explicação</td></tr><tr><td>Terça</td><td>Listening</td></tr><tr><td>Quarta</td><td>Exercícios</td></tr><tr><td>Quinta</td><td>Speaking</td></tr><tr><td>Sexta</td><td>Reading + vocabulary</td></tr><tr><td>Sábado</td><td>Revisão / prova</td></tr></table></div>`;
 updateSide(); document.getElementById("heroPct").textContent=Math.round(Object.values(progress).filter(Boolean).length/24*100)+"%";
}
function showWeeks(){
 let cards=weeks.map(x=>`<div class="card week-card"><div><span class="tag">SEMANA ${x.w} · ${x.level}</span><h3>${x.title}</h3><p class="muted">${x.topic}</p></div><div>${progress[x.w]?"✅ Concluída":"⬜ Pendente"}</div><button class="btn ${progress[x.w]?'secondary':''}" onclick="showWeek(${x.w})">${progress[x.w]?'Revisar':'Estudar'}</button></div>`).join("");
 document.getElementById("main").innerHTML=`<div class="bar"><h1 style="margin-right:auto">📚 As 24 semanas</h1><button class="btn secondary" onclick="showHome()">Dashboard</button></div><div class="grid">${cards}</div>`;
}
function showWeek(n){
 let x=weeks[n-1];
 let q=x.quiz.map((z,i)=>`<div class="exercise"><b>${i+1}. ${z[0]}</b><div class="options">${z[1].map((o,j)=>`<button class="option" onclick="answer(this,${j},${z[2]},${n},${i})">${o}</button>`).join("")}</div><div id="fb-${n}-${i}" class="feedback"></div></div>`).join("");
 document.getElementById("main").innerHTML=`<div class="week-nav">${weeks.map(a=>`<button class="${progress[a.w]?'done':''}" onclick="showWeek(${a.w})">${a.w}</button>`).join("")}</div><article class="card lesson"><span class="tag">SEMANA ${x.w} · ${x.level}</span><h1>${x.title}</h1><p class="muted">${x.topic}</p>
 <div class="section"><h2>🎯 Objetivos</h2><ul>${x.goals.map(g=>`<li>${g}</li>`).join("")}</ul></div>
 <div class="section"><h2>💡 Explicação rápida</h2><p>${x.explain}</p></div>
 <div class="section"><h2>🗣️ Exemplos</h2>${x.examples.map(e=>`<div class="example">${e}</div>`).join("")}</div>
 <div class="section"><h2>🧠 Vocabulário</h2><div class="bar">${x.vocab.map(v=>`<span class="tag">${v}</span>`).join("")}</div></div>
 <div class="section"><h2>✏️ Exercícios</h2>${q}</div>
 <div class="tip"><b>Speaking:</b> explique este conteúdo em voz alta para sua professora/namorada por pelo menos 1 minuto. Na semana de revisão, aumente para 2–5 minutos.</div>
 <div class="bar" style="margin-top:20px"><button class="btn" onclick="completeWeek(${n})">${progress[n]?'✓ Semana concluída':'Marcar como concluída'}</button><button class="btn secondary" onclick="showWeek(${Math.min(24,n+1)})">Próxima semana →</button></div>
 </article>`;
}
function answer(btn,j,correct,n,i){let parent=btn.parentElement;[...parent.children].forEach(b=>b.disabled=true);if(j===correct){btn.classList.add("correct");document.getElementById(`fb-${n}-${i}`).textContent="✅ Correto!";document.getElementById(`fb-${n}-${i}`).style.color="var(--ok)"}else{btn.classList.add("wrong");parent.children[correct].classList.add("correct");document.getElementById(`fb-${n}-${i}`).textContent="❌ Ainda não. A resposta correta está marcada em verde.";document.getElementById(`fb-${n}-${i}`).style.color="var(--bad)"}}
function completeWeek(n){progress[n]=true;save();toast("Semana "+n+" concluída! 🎉");showWeek(n)}
function showVocabulary(){
 let all=[...new Set(weeks.flatMap(x=>x.vocab))];
 document.getElementById("main").innerHTML=`<div class="card"><h1>🧠 Banco de vocabulário</h1><p class="muted">Use estas palavras para criar frases. O objetivo é transformar vocabulário passivo em ativo.</p><input class="input" placeholder="Filtrar palavras..." oninput="filterVocab(this.value)"><div id="vocabList" class="bar" style="margin-top:15px">${all.map(v=>`<span class="tag vocab">${v}</span>`).join("")}</div></div>`;
}
function filterVocab(q){[...document.querySelectorAll(".vocab")].forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q.toLowerCase())?"inline-block":"none")}
function showReview(){
 document.getElementById("main").innerHTML=`<div class="card"><h1>🔄 Revisão semanal</h1><p>Antes de avançar, responda oralmente:</p><ol><li>What did you learn this week?</li><li>Can you give 3 examples?</li><li>Can you use the vocabulary in a sentence?</li><li>Can you explain the grammar without looking?</li></ol><div class="tip"><b>Para ensinar sua namorada:</b> peça que ela explique a regra para você. Se ela consegue ensinar, provavelmente entendeu.</div><h2>Mini desafio</h2><p>Escolha 5 palavras da semana e crie uma história de 30 segundos usando todas.</p></div>`;
}
function showFinal(){
 document.getElementById("main").innerHTML=`<div class="card"><h1>🎓 Prova Final</h1><p>Faça quando completar as 24 semanas.</p><div class="grid"><div class="card"><h3>📝 Grammar</h3><p>40 questões sobre os principais tempos e estruturas.</p></div><div class="card"><h3>📖 Reading</h3><p>2 textos com interpretação.</p></div><div class="card"><h3>✍️ Writing</h3><p>Escreva aproximadamente 200 palavras sobre sua vida, estudos e planos.</p></div><div class="card"><h3>🎧 Listening</h3><p>3 áudios: ideia principal + detalhes.</p></div><div class="card"><h3>🗣️ Speaking</h3><p>10 minutos de conversa guiada.</p></div><div class="card"><h3>🏆 Critério</h3><p>Priorize comunicação clara, não perfeição.</p></div></div><button class="btn" onclick="showWeek(24)">Abrir semana 24</button></div>`;
}
function resetProgress(){if(confirm("Zerar todo o progresso?")){progress={};save();showHome();toast("Progresso zerado.")}}
showHome();updateSide();
</script>
